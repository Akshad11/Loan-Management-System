services:
  postgres:
    image: postgres:16-alpine
    container_name: loan_ms_postgres
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loan_ms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loan_ms_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - loan_ms_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: loan_ms_app:latest
    container_name: loan_ms_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-fintech-lms-docker-jwt-secret-2026-production-key}
      FORCE_SEED: ${FORCE_SEED:-false}
    ports:
      - "3000:3000"
    networks:
      - loan_ms_net

volumes:
  postgres_data:
    name: loan_ms_postgres_data

networks:
  loan_ms_net:
    name: loan_ms_network
    driver: bridge
